<html lang="te">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>ఆ రోజులు… — A Telugu Childhood Memory</title>
<meta name="description" content="ఆ రోజులు… మళ్ళీ ఒక్కసారి. Step into a nostalgic Telugu village from the late 1990s and early 2000s.">
<meta name="theme-color" content="#0b0910">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@300;400;500;600;700&family=Noto+Serif+Telugu:wght@400;700;900&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0b0910;--cream:#f5e6c8;--gold:#e8a840;--muted:#9a8a6f;
}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
background:var(--bg);color:var(--cream);
font-family:'Noto Sans Telugu','Noto Serif Telugu',sans-serif;
overflow-x:hidden;-webkit-font-smoothing:antialiased;
-webkit-tap-highlight-color:transparent;
height:100%;
}
button{touch-action:manipulation}

/* ═══ OVERLAYS ═══ */
#grain{
position:fixed;inset:0;z-index:500;pointer-events:none;
opacity:.04;mix-blend-mode:overlay;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
#vignette{
position:fixed;inset:0;z-index:499;pointer-events:none;
background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,5,.55) 100%);
}

/* ═══ CREATOR CREDIT (top) ═══ */
#creator{
position:fixed;top:0;left:0;right:0;z-index:800;
display:flex;align-items:center;justify-content:center;gap:.9rem;
padding:max(.55rem,env(safe-area-inset-top)) 1rem .55rem;
background:rgba(11,9,16,.55);
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
border-bottom:1px solid rgba(232,168,64,.12);
font-family:'Noto Sans Telugu',sans-serif;font-size:.72rem;color:rgba(245,230,200,.75);
letter-spacing:.03em;white-space:nowrap;
}
#creator .sep{
width:3px;height:3px;border-radius:50%;background:var(--gold);flex:none;
}
#creator a{
color:var(--gold);text-decoration:none;display:inline-flex;align-items:center;gap:.25rem;
transition:opacity .2s;
}
#creator a:hover{opacity:.75}
#creator svg{width:12px;height:12px;fill:currentColor;flex:none}
@media(max-width:640px){
#creator{font-size:.62rem;gap:.55rem}
#creator .hide-sm{display:none}
}

/* ═══ LIVE CLOCK (left side) ═══ */
#clockbox{
position:fixed;top:max(2rem,calc(env(safe-area-inset-top) + 1.4rem));left:max(1rem,env(safe-area-inset-left));
z-index:790;
display:flex;align-items:center;gap:.45rem;
padding:.42rem .8rem;border-radius:999px;
background:rgba(11,9,16,.55);
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
border:1px solid rgba(232,168,64,.16);
font-family:'Noto Sans Telugu',sans-serif;
color:rgba(245,230,200,.85);
font-size:.78rem;letter-spacing:.04em;
white-space:nowrap;
animation:rise 1.1s ease 1s both;
}
#clockbox svg{width:13px;height:13px;fill:var(--gold);flex:none}
#clockbox .c{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
@media(max-width:640px){
#clockbox{top:max(1.7rem,calc(env(safe-area-inset-top) + 1.1rem));left:max(.7rem,env(safe-area-inset-left));font-size:.66rem}
#clockbox svg{width:11px;height:11px}
}

/* ═══ HERO (single screen) ═══ */
#hero{
position:relative;width:100%;height:100vh;height:100dvh;
min-height:100dvh;
display:flex;align-items:center;justify-content:center;text-align:center;
overflow:hidden;
}
#hero .bg{
position:absolute;inset:0;
background-image:url('use this image.png');
background-size:cover;
background-position:center 35%;
animation:hero-zoom 8s ease-out both;
}
@media(orientation:portrait){
#hero .bg{background-position:center 30%}
}
@media(orientation:landscape){
#hero .bg{background-position:center 45%}
}
@keyframes hero-zoom{0%{transform:scale(1.12)}100%{transform:scale(1)}}
#hero .overlay{
position:absolute;inset:0;
background:
linear-gradient(180deg,rgba(11,9,16,.5) 0%,rgba(11,9,16,.18) 35%,rgba(11,9,16,.2) 65%,rgba(11,9,16,.8) 100%),
radial-gradient(ellipse at center,rgba(11,9,16,.05) 0%,rgba(11,9,16,.35) 100%);
}
#hero .content{position:relative;z-index:2;padding:0 1.5rem;max-width:820px}
#hero .kicker{
font-family:'Caveat',cursive;font-size:clamp(1rem,2vw,1.35rem);
color:var(--gold);letter-spacing:.22em;text-transform:uppercase;
opacity:.85;animation:rise 1.1s ease .4s both;
}
#hero h1{
font-family:'Noto Serif Telugu',serif;font-weight:900;
font-size:clamp(3.2rem,11vw,7.5rem);
line-height:1.1;margin-top:.5rem;
background:linear-gradient(180deg,#fff 0%,#f3d9a4 60%,#d9a23f 100%);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
text-shadow:0 4px 40px rgba(0,0,0,.45);
animation:rise 1.1s ease .55s both;
}
#hero .subtitle{
font-size:clamp(1.1rem,3vw,1.8rem);color:rgba(245,230,200,.85);
margin-top:.7rem;font-weight:400;letter-spacing:.04em;
animation:rise 1.1s ease .7s both;
}
#hero .en-label{
font-family:'Caveat',cursive;font-size:clamp(.95rem,1.8vw,1.25rem);
color:rgba(212,168,80,.7);margin-top:.6rem;font-style:italic;
letter-spacing:.14em;animation:rise 1.1s ease .85s both;
}
#hero .divider{
width:64px;height:1px;margin:1.3rem auto 0;
background:linear-gradient(90deg,transparent,var(--gold),transparent);
animation:rise 1.1s ease 1s both;
}
#hero .hero-play{
margin-top:2rem;display:inline-flex;align-items:center;gap:.6rem;
padding:.85rem 2.1rem;border-radius:999px;cursor:pointer;
font-family:'Noto Sans Telugu',sans-serif;font-size:1rem;color:#1a1305;
background:linear-gradient(180deg,#f0b954,#dc9f34);
border:none;box-shadow:0 10px 40px rgba(232,168,64,.35),inset 0 1px 0 rgba(255,255,255,.4);
transition:transform .3s,box-shadow .3s;
animation:rise 1.1s ease 1.15s both;
}
#hero .hero-play:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 50px rgba(232,168,64,.5)}
#hero .hero-play .ico{display:flex;align-items:center;justify-content:center}
#hero .hero-play .ico svg{width:16px;height:16px;fill:currentColor;display:block}
@keyframes rise{0%{opacity:0;transform:translateY(26px)}100%{opacity:1;transform:translateY(0)}}

/* ═══ AUDIO BAR (no video, controls only) ═══ */
#audio-bar{
position:fixed;z-index:700;bottom:1.2rem;left:50%;
transform:translateX(-50%) translateY(190%);
display:flex;align-items:center;gap:.55rem;
padding:.5rem .9rem;border-radius:999px;
background:rgba(15,12,22,.88);
backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
border:1px solid rgba(232,168,64,.18);
box-shadow:0 14px 50px rgba(0,0,0,.55);
transition:transform .55s cubic-bezier(.22,1,.36,1);
white-space:nowrap;
}
#audio-bar.visible{transform:translateX(-50%) translateY(0)}
#audio-bar .eq{display:flex;align-items:flex-end;gap:3px;height:18px}
#audio-bar .eq span{
width:3px;border-radius:2px;background:linear-gradient(180deg,#f0b954,#e8a840);
animation:eq 1s ease-in-out infinite;
}
#audio-bar .eq span:nth-child(1){animation-delay:0s}
#audio-bar .eq span:nth-child(2){animation-delay:.25s}
#audio-bar .eq span:nth-child(3){animation-delay:.5s}
#audio-bar .eq span:nth-child(4){animation-delay:.15s}
#audio-bar .eq span:nth-child(5){animation-delay:.35s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
#audio-bar .label{
font-family:'Noto Sans Telugu',sans-serif;font-size:.8rem;color:var(--cream);
letter-spacing:.03em;max-width:170px;overflow:hidden;text-overflow:ellipsis;
}
#audio-bar .ctrl{
background:none;border:none;color:var(--cream);cursor:pointer;
width:36px;height:36px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
opacity:.75;transition:opacity .2s,background .2s;
}
#audio-bar .ctrl svg{width:18px;height:18px;fill:currentColor;display:block}
#audio-bar .ctrl:hover{opacity:1;background:rgba(232,168,64,.12)}
#audio-bar .ctrl.skip{opacity:.7}
#audio-bar .ctrl.skip:hover{opacity:1}
#audio-bar .ctrl.pause{
background:linear-gradient(180deg,#f0b954,#dc9f34);color:#1a1305;
width:40px;height:40px;opacity:1;
box-shadow:0 4px 18px rgba(232,168,64,.35);
}
#audio-bar .ctrl.pause svg{width:20px;height:20px}

/* ═══ SEPARATE VOLUME BUTTON + POPUP ═══ */
#vol-btn{
position:fixed;right:max(1rem,env(safe-area-inset-right));
bottom:max(1.4rem,calc(env(safe-area-inset-bottom) + 1.4rem));
z-index:710;width:46px;height:46px;border-radius:50%;cursor:pointer;
display:flex;align-items:center;justify-content:center;
background:rgba(15,12,22,.88);
backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
border:1px solid rgba(232,168,64,.22);
box-shadow:0 10px 34px rgba(0,0,0,.5);
opacity:0;pointer-events:none;transform:scale(.6);
transition:opacity .4s,transform .4s,background .2s;
}
#vol-btn svg{width:22px;height:22px;fill:var(--gold)}
#vol-btn.show{opacity:1;pointer-events:auto;transform:scale(1)}
#vol-btn:hover{background:rgba(232,168,64,.14)}
#vol-pop{
position:fixed;right:max(1rem,env(safe-area-inset-right));
bottom:calc(4.4rem + env(safe-area-inset-bottom));
z-index:711;padding:.7rem .9rem;border-radius:16px;
display:flex;flex-direction:column;align-items:center;gap:.55rem;
background:rgba(15,12,22,.95);
backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
border:1px solid rgba(232,168,64,.22);
box-shadow:0 16px 50px rgba(0,0,0,.6);
opacity:0;pointer-events:none;transform:translateY(8px);
transition:opacity .3s,transform .3s;
}
#vol-pop.show{opacity:1;pointer-events:auto;transform:translateY(0)}
#vol-pop input[type=range]{
width:120px;accent-color:var(--gold);height:4px;cursor:pointer;
-webkit-appearance:none;appearance:none;background:rgba(232,168,64,.2);
border-radius:4px;outline:none;
}
#vol-pop input[type=range]::-webkit-slider-thumb{
-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
background:linear-gradient(180deg,#f0b954,#dc9f34);
border:none;box-shadow:0 2px 8px rgba(0,0,0,.5);
}
#vol-pop input[type=range]::-moz-range-thumb{
width:16px;height:16px;border-radius:50%;border:none;
background:linear-gradient(180deg,#f0b954,#dc9f34);
box-shadow:0 2px 8px rgba(0,0,0,.5);
}
#vol-pop .vol-val{
font-family:'Noto Sans Telugu',sans-serif;font-size:.7rem;color:var(--muted);
letter-spacing:.08em;
}
#vol-pop .vol-ico{font-size:1.05rem;color:var(--gold)}
#vol-pop .vol-ico svg{width:18px;height:18px;fill:var(--gold);display:block}

@media(max-width:640px){
html,body{height:100%}
#hero .content{padding:0 1.1rem}
#hero .kicker{font-size:.95rem;letter-spacing:.16em}
#hero h1{font-size:clamp(2.4rem,13vw,4.2rem)}
#hero .subtitle{font-size:clamp(.95rem,4vw,1.25rem)}
#hero .hero-play{margin-top:1.6rem;padding:.8rem 1.8rem}

/* audio bar: fit narrow screens, wrap into one row */
#audio-bar{
bottom:max(0.9rem,env(safe-area-inset-bottom));
left:.7rem;right:.7rem;transform:translateY(190%);
justify-content:center;flex-wrap:wrap;
padding:.5rem .7rem;border-radius:18px;
gap:.4rem .5rem;
}
#audio-bar.visible{transform:translateY(0)}
#audio-bar .label{max-width:82px;font-size:.72rem}
#audio-bar .eq{height:14px}
#audio-bar .eq span{width:2.5px}
#audio-bar .ctrl{width:32px;height:32px}
#audio-bar .ctrl.pause{width:38px;height:38px}
#vol-btn{bottom:max(1.1rem,calc(env(safe-area-inset-bottom) + 1.1rem))}
}
@media(max-width:380px){
#audio-bar .label{display:none}
}

/* ═══ HIDDEN PLAYER (audio stream, top-left, invisible) ═══ */
#yt-holder{
position:fixed;top:0;left:0;width:420px;height:236px;
opacity:0;pointer-events:none;z-index:-1;
}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
animation-duration:.01ms!important;animation-iteration-count:1!important;
transition-duration:.01ms!important;
}
}
</style>
</head>

/* ═══ YOUTUBE AUDIO PLAYER ═══ */
(function(){
const heroPlay=document.getElementById('hero-play');
const heroIcon=document.querySelector('#hero-play .ico');
const bar=document.getElementById('audio-bar');
const playBtn=document.getElementById('play-btn');
const prevBtn=document.getElementById('prev-btn');
const nextBtn=document.getElementById('next-btn');
const volSlider=document.getElementById('vol-slider');
const volBtn=document.getElementById('vol-btn');
const volPop=document.getElementById('vol-pop');
const volVal=document.getElementById('vol-val');
const trackName=document.getElementById('track-name');

let yt=null;
let started=false;
let isPlaying=false;
let currentIndex=0;

/* ═══ PERSISTENCE: resume from where user left off ═══ */
const LS_KEY='aaRojuluPlayer';
function loadState(){
try{
const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');
if(s&&typeof s==='object')return s;
}catch(e){}
return null;
}
function saveState(){
try{
const s={index:currentIndex,time:yt?yt.getCurrentTime():0,volume:parseInt(volSlider.value),playing:isPlaying,ts:Date.now()};
localStorage.setItem(LS_KEY,JSON.stringify(s));
}catch(e){}
}

function total(){return SONGS.length}

window.onYouTubeIframeAPIReady=function(){
yt=new YT.Player('yt-player',{
height:'236',width:'420',
playerVars:{
controls:0,
rel:0,
playsinline:1,
disablekb:1,
loop:1
},
events:{
onReady:function(){
const saved=loadState();
if(saved&&typeof saved.volume==='number'){
volSlider.value=saved.volume;
updateVolLabel();
}
const vol=parseInt(volSlider.value);
try{yt.setVolume(vol);}catch(e){}
let startIdx=0;
if(saved&&typeof saved.index==='number'){
startIdx=((saved.index%total())+total())%total();
}
currentIndex=startIdx;
/* load all 46 songs explicitly so none are ever dropped */
try{yt.loadPlaylist(SONGS.map(s=>s.id),startIdx);}catch(e){}
setTimeout(()=>{
try{
if(saved&&typeof saved.time==='number'&&saved.time>1){
yt.seekTo(saved.time,true);
}
}catch(e){}
/* restore playing state if it was playing before */
if(saved&&saved.playing){
setTimeout(()=>{try{yt.playVideo()}catch(e){}},250);
}
updateTrack();
},600);
},
onStateChange:function(e){
if(e.data===YT.PlayerState.PLAYING){
isPlaying=true;
try{currentIndex=yt.getPlaylistIndex();}catch(e){}
updateUI();
updateTrack();
saveState();
}else if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED){
isPlaying=false;
updateUI();
saveState();
}
},
onError:function(){trackName.textContent='Press play again';}
}
});
};

function loadApi(){
const s=document.createElement('script');
s.src='https://www.youtube.com/iframe_api';
document.head.appendChild(s);
}

function play(){
if(!started){
loadApi();
started=true;
bar.classList.add('visible');
volBtn.classList.add('show');
setTimeout(()=>{
if(yt&&!isPlaying){try{yt.playVideo()}catch(e){}}
saveState();
},1200);
}else{
if(yt)yt.playVideo();
isPlaying=true;
updateUI();
saveState();
}
}
function pause(){
if(yt)yt.pauseVideo();
isPlaying=false;
updateUI();
saveState();
}
function toggle(){
if(isPlaying){pause()}
else{play()}
}
function goTo(i){
const idx=((i%total())+total())%total();
currentIndex=idx;
if(yt){
try{yt.playVideoAt(idx);}catch(e){}
}
isPlaying=true;
updateUI();
updateTrack();
saveState();
}
function next(){goTo(currentIndex+1)}
function prev(){goTo(currentIndex-1)}

function updateTrack(){
try{
const s=SONGS[currentIndex];
if(s&&s.title)trackName.textContent=(currentIndex+1)+'. '+s.title;
else{
const d=yt.getVideoData();
if(d&&d.title)trackName.textContent=d.title;
}
}catch(e){}
}
const PLAY_SVG='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE_SVG='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

function updateUI(){
heroIcon.innerHTML=isPlaying?PAUSE_SVG:PLAY_SVG;
playBtn.innerHTML=isPlaying?PAUSE_SVG:PLAY_SVG;
}

heroPlay.addEventListener('click',toggle);
playBtn.addEventListener('click',toggle);
prevBtn.addEventListener('click',prev);
nextBtn.addEventListener('click',next);

/* separate volume button + popup */
function updateVolLabel(){volVal.textContent=volSlider.value+'%'}
volBtn.addEventListener('click',()=>{
volPop.classList.toggle('show');
});
document.addEventListener('click',(e)=>{
if(!e.target.closest('#vol-btn')&&!e.target.closest('#vol-pop')){
volPop.classList.remove('show');
}
});
volSlider.addEventListener('input',()=>{
updateVolLabel();
if(yt)yt.setVolume(parseInt(volSlider.value));
saveState();
});

/* keep position synced every 5s + on leaving the page */
setInterval(saveState,5000);
window.addEventListener('pagehide',saveState);
document.addEventListener('visibilitychange',function(){
if(document.hidden){saveState();}
});

/* ═══ LIVE CLOCK (IST) ═══ */
(function(){
const clock=document.getElementById('clock');
function tick(){
try{
const now=new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour12:true,hour:'2-digit',minute:'2-digit'});
clock.textContent=now;
}catch(e){}
}
tick();
setInterval(tick,1000);
})();
})();
</script>
</body>
</html>
